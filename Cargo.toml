[package]
name = "bevy_soundfont_synth"
version = "0.1.0"
edition = "2024"
repository.workspace = true
license.workspace = true

[workspace]
# Edition 2024 defaults to resolver "3"; pin it explicitly.
resolver = "3"
members = ["xtask"]

[workspace.package]
repository = "https://github.com/beicause/bevy_soundfont_synth"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dependencies]
bevy = { version = "0.20.0-rc.1", default-features = false, features = ["bevy_asset", "bevy_log", "std"] }

firewheel = { version = "0.14.0", default-features = false, features = ["cpal", "scheduled_events", "std"] }
rustysynth-ext = { package = "rustysynth-ext", version = "1.5.0-alpha.1", features = ["sf3"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.0-rc.1", default-features = false, features = ["web"] }
firewheel = { version = "0.14.0", default-features = false, features = ["wasm-bindgen"] }

[features]
android-game-activity = ["bevy/android-game-activity"]
android-native-activity = ["bevy/android-native-activity"]
wayland = ["bevy/wayland"]
x11 = ["bevy/x11"]

[lints]
workspace = true

[profile.dev.package."*"]
opt-level = 1

[profile.test]
opt-level = 1
