name: Web demo

on:
  workflow_dispatch:
  push:
    branches: ["master"]

# Deploy the `examples/demo` app to GitHub Pages. Requires Pages to be
# served from "GitHub Actions" (the `configure-pages` step below enables it).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"
  CACHE_SUFFIX: f # cache busting

jobs:
  deploy-web-demo:
    name: Deploy web demo to GitHub Pages
    # runtime is normally 5 minutes
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal
          rustup target add wasm32-unknown-unknown

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: web-demo-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install wasm-bindgen
        run: cargo binstall -y wasm-bindgen-cli

      - name: Fetch demo assets
        # TimGM6mb.sf2 / FluidR3Mono_GM.sf3 are downloaded by xtask, the demo
        # MIDI file is generated by it ("Only Time.mid" ships with the repo).
        run: |
          cargo xtask fetch-fonts
          cargo xtask generate-demo-midi

      - name: Build web demo
        # Assembles index.html + wasm-bindgen glue + assets into `web-dist/`.
        run: cargo xtask build-web --release

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
